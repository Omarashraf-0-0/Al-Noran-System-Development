name: alnoran_mobile_application
description: "Al-Noran-Mobile-APP"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  file_picker: ^8.1.2
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  lottie: ^3.1.0
  flutter_secure_storage: ^9.0.0
  go_router: ^14.6.2
  # State Management for Theme
  provider: ^6.1.2
  # Firebase for Push Notifications
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1
  # Permission handler for Android 13+ notification permission
  permission_handler: ^11.3.1
  # Google Sign In
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Testing dependencies
  mockito: ^5.4.4
  mocktail: ^1.0.4  # Easy mocking without code generation
  build_runner: ^2.4.8
  integration_test:
    sdk: flutter
  network_image_mock: ^2.1.1
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.3

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/img/logo.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/img/
    - assets/img/logo.png
  # الخطوط العربية (سيتم تفعيلها بعد تحميل الخطوط)
